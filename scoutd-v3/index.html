<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scout'd — Where youth football lives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Barlow+Condensed:wght@900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #07060B;
    --bg-hero: #000000;
    --text: #EDEAF5;
    --text-strong: #FFFFFF;
    --text-dim: rgba(255,255,255,0.55);
    --text-body: rgba(255,255,255,0.70);
    --text-body-soft: rgba(255,255,255,0.65);
    --text-faint: rgba(255,255,255,0.40);
    --primary: #7C3AED;
    --line: rgba(255,255,255,0.12);
    --line-faint: rgba(255,255,255,0.08);
    --nav-bg: rgba(7,4,14,0.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg-page); color: var(--text-strong); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  img, video { display: block; max-width: 100%; }
  ::selection { background: var(--primary); color: white; }

  .display { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; line-height: 0.92; }
  .mono { font-family: 'JetBrains Mono', monospace; font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase; }
  .wordmark { font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 0; text-transform: uppercase; }

  .container { max-width: 1440px; margin: 0 auto; padding: 0 60px; }
  section { position: relative; }

  /* NAV */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--nav-bg);
    backdrop-filter: blur(20px) saturate(1.4);
    border-bottom: 1px solid var(--line-faint);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 17px 50px;
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; }
  .nav-logo img { height: 32px; width: auto; }
  .nav-logo .wordmark { font-size: 22px; color: var(--text); }
  .nav-links { display: flex; align-items: center; gap: 36px; }
  .nav-links a { font-size: 14px; font-weight: 500; color: var(--text-dim); transition: color 0.2s; }
  .nav-links a:hover { color: var(--text-strong); }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .nav-lang { font-size: 14px; font-weight: 500; color: var(--text-dim); padding: 10px 12px; }

  .btn { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; transition: transform 0.3s, background 0.3s, box-shadow 0.4s; white-space: nowrap; }
  .btn-primary { background: var(--primary); color: white; padding: 12px 20px; font-size: 14px; box-shadow: 0 6px 24px rgba(124,58,237,0.25); }
  .btn-primary:hover { background: #6D28D9; transform: translateY(-1px); }
  .btn-primary-lg { padding: 18px 28px; font-size: 16px; }
  .btn-ghost { background: rgba(255,255,255,0.04); color: var(--text); padding: 18px 28px; font-size: 16px; backdrop-filter: blur(10px); }
  .btn-ghost:hover { background: rgba(255,255,255,0.08); }

  /* HERO */
  .hero {
    position: relative;
    min-height: 100vh;
    background: var(--bg-hero);
    overflow: hidden;
    padding-top: 78px;
  }
  .hero-video {
    position: absolute; inset: 0; overflow: hidden; z-index: 0;
  }
  .hero-video video, .hero-video img {
    width: 100%; height: 100%; object-fit: cover;
    filter: grayscale(1) contrast(1.15) brightness(0.55);
  }
  .hero-overlay {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0.95) 100%);
  }
  .hero-glow {
    position: absolute; left: -16%; top: 70%; width: 132%; height: 60%;
    background: radial-gradient(ellipse at center, rgba(124,58,237,0.45) 0%, transparent 70%);
    pointer-events: none; z-index: 2;
  }
  .hero-content {
    position: relative; z-index: 3;
    max-width: 1320px; margin: 0 auto;
    padding: 50vh 60px 80px;
    display: flex; flex-direction: column;
    min-height: 100vh; justify-content: flex-end;
  }
  .hero-headline {
    display: flex; flex-direction: column;
    line-height: 0.88;
  }
  .hero-headline .word {
    font-size: clamp(64px, 9vw, 120px);
    color: var(--text-strong);
    letter-spacing: -0.03em;
  }
  .hero-headline .word + .word { margin-top: -0.08em; }
  .hero-body {
    max-width: 420px; margin-top: 28px;
    font-size: 17px; line-height: 1.55;
    color: var(--text-body);
  }
  .hero-buttons {
    display: flex; gap: 12px; margin-top: 56px; flex-wrap: wrap;
  }

  /* FEATURES */
  .feature {
    position: relative;
    background: var(--bg-page);
    padding: 80px 0 100px;
    border-top: 1px solid var(--line);
    overflow: hidden;
  }
  .feature-grid {
    position: relative; max-width: 1440px; margin: 0 auto;
    padding: 0 60px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 60px;
    min-height: 660px; align-items: center;
  }
  .feature-copy { position: relative; z-index: 2; }
  .feature-num {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: clamp(120px, 17vw, 240px);
    line-height: 1; color: rgba(255,255,255,0.4);
    position: absolute; top: 80px;
    pointer-events: none; user-select: none; z-index: 1;
  }
  .feature-num.left { left: 60px; }
  .feature-num.right { right: 60px; }
  .feature-kicker {
    font-size: 11px; color: var(--text-dim);
    margin-bottom: 28px;
  }
  .feature-head {
    display: flex; flex-direction: column; line-height: 0.92;
    margin-bottom: 32px;
  }
  .feature-head span {
    font-size: clamp(56px, 8vw, 112px);
    color: var(--text-strong);
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    text-transform: uppercase; letter-spacing: -0.02em;
  }
  .feature-head span + span { margin-top: -0.05em; }
  .feature-head .accent { color: var(--primary); }
  .feature-body {
    max-width: 440px;
    font-size: 16px; line-height: 1.6;
    color: var(--text-body-soft);
    margin-bottom: 40px;
  }
  .feature-link {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 500;
    color: var(--text-strong);
    letter-spacing: 0.08em; text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,0.6);
    padding-bottom: 4px;
    transition: gap 0.2s;
  }
  .feature-link:hover { gap: 14px; }

  .feature-mockup {
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .feature-mockup img {
    position: relative; z-index: 2;
    width: 290px; height: auto;
    filter: drop-shadow(0 20px 50px rgba(0,0,0,0.5));
  }
  .feature.reverse .feature-copy { order: 2; }
  .feature.reverse .feature-mockup { order: 1; }
  .feature.reverse .feature-glow {
    position: absolute;
    left: -40%; right: -40%; top: -40%; bottom: -40%;
    background: radial-gradient(ellipse at center, rgba(124,58,237,0.18) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }

  /* List tags */
  .tags {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 40px;
  }
  .tag {
    display: inline-flex; align-items: center;
    padding: 7px 12px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.25);
    font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
    color: rgba(255,255,255,0.85);
    text-transform: uppercase;
  }

  /* FOOTER */
  .footer {
    background: var(--bg-page);
    border-top: 1px solid var(--line);
    padding: 70px 0 30px;
  }
  .footer-grid {
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 80px;
    margin-bottom: 50px;
  }
  .footer-brand .wordmark { font-size: 36px; color: var(--text); display: block; margin-bottom: 16px; }
  .footer-brand p {
    font-size: 14px; color: var(--text-body-soft);
    max-width: 320px; line-height: 1.55;
  }
  .footer-col h4 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--text-dim);
    letter-spacing: 0.18em; text-transform: uppercase;
    margin-bottom: 20px; font-weight: 400;
  }
  .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .footer-col a {
    font-size: 14px; color: rgba(255,255,255,0.75);
    transition: color 0.2s;
  }
  .footer-col a:hover { color: var(--text-strong); }
  .footer-divider {
    height: 1px; background: var(--line);
    margin-bottom: 30px;
  }
  .footer-bottom {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 16px;
  }
  .footer-bottom span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: rgba(255,255,255,0.45);
    letter-spacing: 0.14em; text-transform: uppercase;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .nav-links { display: none; }
    .nav-inner { padding: 14px 24px; }
    .container { padding: 0 24px; }
    .hero-content { padding: 30vh 24px 60px; }
    .feature-grid { grid-template-columns: 1fr; padding: 0 24px; gap: 50px; min-height: auto; }
    .feature { padding: 80px 0; }
    .feature-num { font-size: 96px; top: 40px; }
    .feature.reverse .feature-copy { order: 1; }
    .feature.reverse .feature-mockup { order: 2; }
    .footer-grid { grid-template-columns: 1fr 1fr; gap: 40px; }
  }
  @media (max-width: 500px) {
    .footer-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="v3.jsx"></script>

</body>
</html>
